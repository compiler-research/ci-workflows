# projects.yaml -- the projects `bin/start` offers a newcomer.
#
# cells.yaml answers "what does the cache hold"; this file answers "who
# is it for". They are separate because the two lists diverge: most
# cells serve several projects, and a project pins exactly one cell for
# the environment it wants a contributor to develop in -- not
# necessarily every cell its CI matrix touches.
#
# Why the cell is written out here although bin/cells.py can read it
# out of a project's workflows: the menu shows each project's toolchain
# and download size before anything is cloned. After cloning, bin/start
# reads the row back with bin/cells.py and the project wins if it
# disagrees on any coord field, so a stale entry self-heals. verify.yml
# checks every entry against cells.yaml. Repositories not listed here
# work too (`bin/start --repo`); the catalog's value is that it is
# curated -- it names the one row a newcomer should start from.
#
# Adding a project:
#   - Pick the matrix row a new contributor should develop against --
#     the plainest Linux row, not the sanitizer or cross-compile ones.
#   - Record its cell: `bin/start --list --repo <clone>` prints the
#     cell each row resolves to. It must already appear in cells.yaml;
#     verify.yml rejects the entry otherwise.
#   - `workflow` and `row` say where the cell came from; bin/start
#     re-reads that row after cloning.
#
# Fields: name, description, repo, workflow, row, recipe, version, os,
# arch. All required.

projects:
  - name: CARTopiaX
    description: CAR T-cell therapy agent-based model, built on BioDynaMo
    repo: https://github.com/compiler-research/CARTopiaX
    workflow: .github/workflows/ci.yml
    row: ubu24-gcc
    recipe: biodynamo
    version: v1.05-cr-20260812-01
    os: ubuntu-24.04
    arch: x86_64

  - name: CppInterOp
    description: C++ interoperability layer backing cppyy and Python bindings
    repo: https://github.com/compiler-research/CppInterOp
    workflow: .github/workflows/main.yml
    row: ubu24-x86-gcc12-llvm22
    recipe: llvm-release
    version: '22'
    os: ubuntu-24.04
    arch: x86_64

  - name: clad
    description: Automatic differentiation for C/C++, as a Clang plugin
    repo: https://github.com/vgvassilev/clad
    workflow: .github/workflows/ci.yml
    row: ubu24-clang20-runtime23
    recipe: llvm-release
    version: '23'
    os: ubuntu-24.04
    arch: x86_64
