name: CppJIT build and test (reusable)

# Reusable (per matrix entry) single-cell workflow: builds CppJIT against a chosen CppInterOp
# ref and runs its test suite. Callers own the matrix and fan out (one call per row):
#   - cppjit's own ci.yml: the full supported matrix.
#   - cppjit's nightly.yml: full matrix + sweeps + valgrind.
#   - CppInterOp: 1-2 cells, passing its PR SHA as cppinterop-ref to
#     verify the change doesn't break CppJIT downstream.

on:
  workflow_call:
    inputs:
      cppjit-repo:
        type: string
        default: compiler-research/cppjit
        description: 'owner/repo of CppJIT to check out.'
      cppjit-ref:
        type: string
        default: main
        description: 'CppJIT git ref to check out.'
      cppinterop-ref:
        type: string
        description: |
          CppInterOp ref to build against: branch, tag, or commit SHA (PR
          heads included). Empty uses CppJIT's pinned CPPINTEROP_GIT_TAG.
      os:
        type: string
        required: true
        description: 'Runner image, e.g. ubuntu-24.04 | ubuntu-24.04-arm | macos-26 | macos-26-intel.'
      llvm-version:
        type: string
        required: true
        description: 'LLVM major: "20" | "21" | "22".'
      llvm-flavor:
        type: string
        default: system
        description: "setup-llvm flavor: 'system' (apt/brew, LLVM 20/21), '' (recipe cache, LLVM 22), or 'cling'."
      llvm-flavor-version:
        type: string
        default: ''
        description: "setup-llvm flavor-version (e.g. 'cling-llvm22' for flavor:cling); empty otherwise."
      python-version:
        type: string
        required: true
        description: |
          Python version. A python-flavor cell needs the exact M.N.P of a
          warmed cpython-<flavor> cell (e.g. 3.14.3); otherwise any
          actions/setup-python spec works.
      python-flavor:
        type: string
        default: ''
        description: |
          '' (default) installs via actions/setup-python; 'asan' / 'debug'
          install the sanitized or Py_DEBUG CPython recipe via
          setup-cpython (warmed ubuntu-24.04 x86_64 cells only).
      cxx-standard:
        type: string
        default: '20'
        description: 'Runtime C++ standard ("17"/"20").'
      build-type:
        type: string
        default: Release
        description: 'CMAKE_BUILD_TYPE for the CppJIT build.'
      sanitizer:
        type: string
        default: ''
        description: |
          CPPJIT_SANITIZERS value: '' (default) or "Address;Undefined".
          Pair with a recipe llvm-flavor ('asan') — the cell compiles with
          that recipe's clang and preloads its asan runtime. Mutually
          exclusive with valgrind.
      valgrind:
        type: boolean
        default: false
        description: 'Run the valgrind pass (Linux only).'
      run-xfail-crashing-tests:
        type: boolean
        default: false
        description: 'Run the xfail-crash and xfail->skipif sweeps.'
      extra-cmake-defines:
        type: string
        default: ''
        description: |
          Whitespace-separated KEY=VALUE list, each forwarded to the
          CppJIT build as a CMake cache define.
      ci-workflows-ref:
        type: string
        default: main
        description: 'ci-workflows ref setup-llvm reads recipes/ from (recipe flavors only).'
    outputs:
      result-summary:
        description: 'Last line of the pytest summary for this cell.'
        value: ${{ jobs.build-test.outputs.summary }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ${{ inputs.os }}
    name: Build & Test
    outputs:
      summary: ${{ steps.summary.outputs.line }}
    steps:
      # valgrind and asan instrument the same process; a cell picks one.
      - name: Refuse a valgrind and sanitizer combination
        if: ${{ inputs.valgrind && inputs.sanitizer != '' }}
        shell: bash
        run: |
          echo "::error::valgrind and sanitizer are mutually exclusive; pick one per cell"
          exit 1

      # Only the asan recipe flavor ships clang's sanitizer runtimes;
      # other toolchains fail at link time deep in the build.
      - name: Refuse a sanitizer without the asan LLVM flavor
        if: ${{ inputs.sanitizer != '' && inputs.llvm-flavor != 'asan' }}
        shell: bash
        run: |
          echo "::error::sanitizer requires llvm-flavor 'asan'; other flavors carry no sanitizer runtimes"
          exit 1

      - name: Checkout CppJIT
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.cppjit-repo }}
          ref: ${{ inputs.cppjit-ref }}

      - name: Setup Python ${{ inputs.python-version }}
        if: ${{ inputs.python-flavor == '' }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      # Flavored interpreters come from the cpython-<flavor> recipe
      # cells; setup-cpython exports PYTHON_EXECUTABLE.
      - name: Setup CPython ${{ inputs.python-version }} [${{ inputs.python-flavor }}]
        if: ${{ inputs.python-flavor != '' }}
        uses: compiler-research/ci-workflows/actions/setup-cpython@main
        with:
          version: ${{ inputs.python-version }}
          os: ${{ inputs.os }}
          flavor: ${{ inputs.python-flavor }}

      - name: Install dependencies
        shell: bash
        env:
          VALGRIND: ${{ inputs.valgrind }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              cmake ninja-build g++ git \
              libedit-dev libeigen3-dev libboost-dev
            if [[ "${VALGRIND}" == "true" ]]; then
              sudo apt-get install -y libc6-dbg
            fi
          elif [[ "${RUNNER_OS}" == "macOS" ]]; then
            brew install ninja eigen boost gnu-sed
          fi

      - name: Setup valgrind
        if: ${{ inputs.valgrind && runner.os == 'Linux' }}
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: valgrind-env
          create-args: valgrind
          condarc: |
            channels:
              - conda-forge

      - name: Add valgrind to PATH
        if: ${{ inputs.valgrind && runner.os == 'Linux' }}
        shell: bash
        run: echo "${MAMBA_ROOT_PREFIX:-$HOME/micromamba}/envs/valgrind-env/bin" >> "${GITHUB_PATH}"

      - name: Setup LLVM ${{ inputs.llvm-version }}
        uses: compiler-research/ci-workflows/actions/setup-llvm@main
        with:
          version: ${{ inputs.llvm-version }}
          os: ${{ inputs.os }}
          flavor: ${{ inputs.llvm-flavor }}
          flavor-version: ${{ inputs.llvm-flavor-version }}
          ref: ${{ inputs.ci-workflows-ref }}

      - name: Build and test
        uses: compiler-research/ci-workflows/actions/build-and-test-cppjit@main
        with:
          cppinterop-ref: ${{ inputs.cppinterop-ref }}
          cxx-standard: ${{ inputs.cxx-standard }}
          build-type: ${{ inputs.build-type }}
          sanitizer: ${{ inputs.sanitizer }}
          python-flavor: ${{ inputs.python-flavor }}
          extra-cmake-defines: ${{ inputs.extra-cmake-defines }}
          llvm-version: ${{ inputs.llvm-version }}
          valgrind: ${{ inputs.valgrind }}
          run-xfail-crashing-tests: ${{ inputs.run-xfail-crashing-tests }}
          cling: ${{ inputs.llvm-flavor == 'cling' }}

      - name: Capture summary
        id: summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          line="$(cat "${GITHUB_WORKSPACE}/pytest-summary.txt" 2>/dev/null || echo 'no summary (build or setup failed)')"
          # Always (re)write the file so a build-failed cell still uploads an artifact and shows in the report
          printf '%s\n' "${line}" > "${GITHUB_WORKSPACE}/pytest-summary.txt"
          echo "line=${line}" >> "$GITHUB_OUTPUT"

      # upload-artifact@v4 refuses duplicate names: every axis that can
      # differ between rows must appear in the slug.
      - name: Compose the result artifact name
        id: cell
        if: always()
        shell: bash
        env:
          OS: ${{ inputs.os }}
          LLVM_VERSION: ${{ inputs.llvm-version }}
          LLVM_FLAVOR: ${{ inputs.llvm-flavor }}
          PYTHON_VERSION: ${{ inputs.python-version }}
          PYTHON_FLAVOR: ${{ inputs.python-flavor }}
          CXX_STANDARD: ${{ inputs.cxx-standard }}
          BUILD_TYPE: ${{ inputs.build-type }}
          SANITIZER: ${{ inputs.sanitizer }}
          VALGRIND: ${{ inputs.valgrind }}
        run: |
          set -euo pipefail
          slug="${OS}-llvm${LLVM_VERSION}-py${PYTHON_VERSION}-cxx${CXX_STANDARD}"
          if [[ "${VALGRIND}" == "true" ]]; then slug+="-vg"; fi
          if [[ "${LLVM_FLAVOR}" == "cling" ]]; then slug+="-cling"; fi
          if [[ "${LLVM_FLAVOR}" == "asan" || "${LLVM_FLAVOR}" == "debug" ]]; then slug+="-llvm${LLVM_FLAVOR}"; fi
          if [[ "${BUILD_TYPE}" != "Release" ]]; then slug+="-${BUILD_TYPE}"; fi
          if [[ -n "${SANITIZER}" ]]; then slug+="-asan"; fi
          if [[ -n "${PYTHON_FLAVOR}" ]]; then slug+="-py${PYTHON_FLAVOR}"; fi
          echo "slug=${slug}" >> "${GITHUB_OUTPUT}"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ steps.cell.outputs.slug }}
          path: ${{ github.workspace }}/pytest-summary.txt
          if-no-files-found: warn
