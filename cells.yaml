# cells.yaml — single source of truth for what the recipe cache holds.
#
# Every entry under `cells:` is a (recipe, version, os, arch) tuple that
# publish-recipe.yml's push trigger will warm on every relevant push,
# and that prune-cache will *not* drop. Anything in Releases whose key
# doesn't correspond to an entry here is an orphan and gets pruned
# after `caps.grace_days`.
#
# Editing this file:
#   - Add a row → next push to main warms it (or just dispatch
#     publish-recipe manually).
#   - Remove a row → next push to main prunes the asset after the
#     grace period (so in-flight PRs that still reference the old key
#     don't break mid-run).
#   - Change build inputs (recipe directory content) → the cache key
#     moves; the old asset becomes an orphan, the new one gets warmed.

# Major LLVM versions we currently support. Informational here;
# package-catchup-probe will key off this list.
support_window:
  - 20
  - 22
  # 23.1.0 was tagged upstream on 2026-08-25, so release/23.x is now a
  # maintained point-release line and 23 cells track the bare major
  # like 22 does. The tag-pinned 23.1.0-rc2 llvm-release cell below
  # stays for consumers that still pass it as setup-llvm's
  # flavor-version; drop that row once they move to the bare major.
  - 23

caps:
  # Soft cap: prune-cache emits ::warning:: when total Release storage
  # is over this. Hard cap: workflow fails. Grace days: how long to
  # leave an orphan asset around so in-flight PRs don't break when
  # the cell is removed from this file or the recipe content changes.
  soft_gb: 20
  hard_gb: 30
  grace_days: 7

cells:
  - { recipe: llvm-asan, version: '22',            os: ubuntu-24.04,    arch: x86_64 }
  # asan on 23: one Linux cell per major, matching 22. The recipe has no
  # version-conditional flags -- it discovers the orc_rt target names from
  # the configured build -- so a new major needs only this row.
  - { recipe: llvm-asan, version: '23',            os: ubuntu-24.04,    arch: x86_64 }
  # llvm-debug: Debug (-O0 -g) + asserts LLVM/Clang, carrying FileCheck
  # and `not` in the install. Serves downstream debug_build rows (clad's
  # ubu24-clang20-runtime22-debug) that previously built LLVM inline on
  # every run. Tracks the latest supported LLVM major, like llvm-release.
  - { recipe: llvm-debug, version: '22',           os: ubuntu-24.04,    arch: x86_64 }
  # llvm-msan: Linux only -- macOS toolchain doesn't ship the
  # MSan-instrumented libc++ stage build cleanly (libcxxabi-on-Mach-O
  # uses Apple's libunwind), and Windows lacks MSan support upstream.
  - { recipe: llvm-msan,  version: '22',            os: ubuntu-24.04,    arch: x86_64 }
  # Every llvm-msan row needs the llvm-release row of the *same version
  # string, os and arch*: recipe.yaml's `bootstrap.version` is the
  # '{version}' template, so fetch_bootstrap resolves msan 23 ->
  # llvm-release 23 and fails the build if that cell is absent (libc++
  # from release/N.x needs a Clang >= N, which is why the bootstrap
  # exists at all). verify.yml's bootstrap-cells-exist check enforces
  # the pairing at PR time rather than 30 minutes into a publish.
  - { recipe: llvm-msan,  version: '23',            os: ubuntu-24.04,    arch: x86_64 }
  # llvm-wasm: cells cover CppInterOp's Unix emscripten rows.
  # build.py's emsdk install/activate goes through `subprocess.run`
  # against the extensionless `emsdk` script, which only resolves
  # under bash; the per-major patch glob is OS-agnostic. The Windows
  # row in CppInterOp's matrix still inline-builds via build-on-miss
  # until the recipe grows `emsdk.bat`/`.ps1` plumbing.
  - { recipe: llvm-wasm,  version: '22',            os: ubuntu-24.04,    arch: x86_64 }
  - { recipe: llvm-wasm,  version: '22',            os: ubuntu-24.04-arm, arch: arm64  }
  - { recipe: llvm-wasm,  version: '22',            os: macos-26,        arch: arm64  }
  # wasm on 23: same three rows as 22 (CppInterOp's Unix emscripten
  # matrix). The per-major patch glob picks up
  # patches/emscripten-clang23-*.patch, which carries only the
  # parseLLVMArgs/-mllvm patch -- the WebAssemblyTargetMachine
  # initAsmInfo/basicCheckForEHAndSjLj reordering the clang22 set needs
  # landed upstream in release/23.x, and re-applying it would abort the
  # build on a failed `git apply`.
  - { recipe: llvm-wasm,  version: '23',            os: ubuntu-24.04,    arch: x86_64 }
  - { recipe: llvm-wasm,  version: '23',            os: ubuntu-24.04-arm, arch: arm64  }
  - { recipe: llvm-wasm,  version: '23',            os: macos-26,        arch: arm64  }
  # llvm-wheel: the wheel-building toolchain (static-only, assertions
  # off; see the recipe). Linux cells build inside the per-arch manylinux
  # container for the glibc 2.28 floor; macOS cells build at deployment
  # target 14.0. Versions are exact release tags — bump every row
  # together; the wheel-image workflow bakes the linux x86_64 artifact
  # into the GHCR toolchain image afterwards.
  - { recipe: llvm-wheel, version: '21.1.8',        os: ubuntu-24.04,     arch: x86_64  }
  - { recipe: llvm-wheel, version: '21.1.8',        os: ubuntu-24.04-arm, arch: aarch64 }
  - { recipe: llvm-wheel, version: '21.1.8',        os: macos-26,         arch: arm64   }
  - { recipe: llvm-wheel, version: '21.1.8',        os: macos-26-intel,   arch: x86_64  }
  # cpython-debug: --with-pydebug + --with-trace-refs + --with-assertions.
  # Linux x86_64 only -- macOS / Windows have stock CPython via the
  # platform package manager; the CI cost of building debug Python on
  # those isn't yet justified.
  - { recipe: cpython-debug, version: '3.14.3',    os: ubuntu-24.04,    arch: x86_64 }
  # cpython-asan: --with-address-sanitizer + --with-undefined-behavior-sanitizer.
  # Linux x86_64 only -- macOS would need an asan-instrumented libc++
  # from llvm-asan in scope (cppyy uses libc++ there), which the
  # Linux row sidesteps because cppyy uses libstdc++.
  - { recipe: cpython-asan,  version: '3.14.3',    os: ubuntu-24.04,    arch: x86_64 }
  # llvm-release: vanilla LLVM/Clang for the latest major across every
  # supported runner image. setup-llvm's default flavor pulls these
  # cells; consumers asking for older majors pick `flavor: system`,
  # which goes through the platform package manager and needs no cell.
  # When LLVM 23 ships, bump the version on these rows; the LLVM 22
  # cells age out via prune-cache after grace_days.
  - { recipe: llvm-release, version: '22',         os: ubuntu-24.04,     arch: x86_64 }
  # cuda-headers: 12.8 is the newest CUDA clang 21 recognises, which keeps
  # -Wunknown-cuda-version out of consumers' findings.
  - { recipe: cuda-headers, version: '12.8.1',     os: ubuntu-24.04,     arch: x86_64 }
  - { recipe: llvm-release, version: '22',         os: ubuntu-24.04-arm, arch: arm64  }
  - { recipe: llvm-release, version: '22',         os: macos-26,         arch: arm64  }
  - { recipe: llvm-release, version: '22',         os: macos-26-intel,   arch: x86_64 }
  - { recipe: llvm-release, version: '22',         os: windows-2025,     arch: x86_64 }
  # arch x86 = 32-bit MSVC target built with the 64-bit-hosted cross
  # tools (vcvars amd64_x86) and run under WOW64. Serves CppInterOp's
  # win32 row: x64 and Itanium share one calling convention, so
  # __thiscall/__cdecl mismatches (e.g. the VTableOverlay dtor-hook
  # bug) only surface on a 32-bit MSVC build.
  - { recipe: llvm-release, version: '22',         os: windows-2025,     arch: x86    }
  - { recipe: llvm-release, version: '22',         os: windows-11-arm,   arch: arm64  }
  # Release candidate, so consumers meet an API break before the
  # release rather than after: no package manager ships a major until
  # it is final. Pinned to the tag rather than '23' -- release/23.x
  # moves while the key does not, so a branch-tracking cell freezes
  # silently under a name claiming the whole line. Bumping to rc3 is a
  # one-line edit that moves the key and republishes. Consumers keep
  # clang-runtime '23' and pass the tag as setup-llvm's flavor-version.
  # Linux x86_64 only; every other platform is a full LLVM build, so
  # add rows when a consumer needs one.
  #
  # 23.1.0 is final as of 2026-08-25, so this row's original reason has
  # expired: the bare-major row below is the one new consumers should
  # pull. Kept only until the consumers still passing the tag as
  # flavor-version move off it -- removing it earlier drops their cell
  # after grace_days and sends them to a 30-minute inline build.
  - { recipe: llvm-release, version: '23.1.0-rc2', os: ubuntu-24.04,     arch: x86_64 }
  # Bare-major 23, tracking release/23.x. Added as llvm-msan 23's
  # bootstrap clang -- fetch_bootstrap looks up llvm-release at the msan
  # cell's own version string -- and it doubles as the default-flavor
  # cell for consumers that want the released 23 line without pinning a
  # tag. Linux x86_64 only, like the rc row: every other platform is a
  # full LLVM build, so add rows when a consumer needs one.
  - { recipe: llvm-release, version: '23',         os: ubuntu-24.04,     arch: x86_64 }
  # llvm-root: `version` doubles as a flavor selector and substitutes
  # into recipes/llvm-root/recipe.yaml's branch_template. Two flavors
  # track root-project/llvm-project's paired branches:
  #   cling-llvm22 = cling's patches alone (CppInterOp's cppyy/cling row).
  #                  Linux-only today; macOS / Windows cling rows still
  #                  share the ROOT-llvm22 superset to keep one cell warm.
  #   ROOT-llvm22  = cling + ROOT's extra clang patches. Built across
  #                  the full CppInterOp matrix so every cling-using
  #                  consumer has a ready cell.
  # The llvm20 pair is gone: ROOT moved to LLVM 22, cling's master
  # followed, and recipe.yaml's branch_template carries one date stamp
  # for both flavors -- so the two majors cannot be warm at once.
  - { recipe: llvm-root, version: 'cling-llvm22',  os: ubuntu-24.04,    arch: x86_64 }
  - { recipe: llvm-root, version: 'ROOT-llvm22',   os: ubuntu-24.04,    arch: x86_64 }
  - { recipe: llvm-root, version: 'ROOT-llvm22',   os: macos-26,        arch: arm64  }
  - { recipe: llvm-root, version: 'ROOT-llvm22',   os: macos-26-intel,  arch: x86_64 }
  - { recipe: llvm-root, version: 'ROOT-llvm22',   os: windows-2025,    arch: x86_64 }
  # kokkos: pinned Serial/Release Kokkos for clad's *-kokkos rows. The apt
  # Kokkos is unusable -- libtrilinos-kokkos-dev is the ancient Trilinos-
  # bundled 3.4 (no host Kokkos::sqrt(double), only the complex overloads),
  # and standalone libkokkos-dev ships a broken CMake package config -- so
  # those rows consume this recipe instead. Because it is a source build,
  # the rows keep their existing runner images: clad's non-arm kokkos row is
  # ubuntu-22.04 (x86_64), its arm row ubuntu-24.04-arm.
  - { recipe: kokkos,     version: '5.1.1',        os: ubuntu-22.04,     arch: x86_64 }
  - { recipe: kokkos,     version: '5.1.1',        os: ubuntu-24.04-arm, arch: arm64  }
  # biodynamo: agent-based simulation framework consumed by CARTopiaX. The
  # artifact bundles its own ROOT under third_party/root, so it is far larger
  # than the other recipes here. build.py measures the install and records
  # install_size_mib in share/bdm-recipe-provenance.json; check it against
  # caps.soft_gb before adding rows.
  #
  # ubuntu-24.04 only for now. Both extra host packages the recipe needs are
  # available there (g++-11 from noble's own repos, python3.9 from deadsnakes),
  # and 22.04 would need deadsnakes just the same, so it buys nothing. No arm64
  # row: BioDynaMo's external/ROOT.cmake has no aarch64 Linux tarball selected
  # (that branch is commented out upstream), so there is no ROOT to download.
  #
  # `version` is a git tag on vgvassilev/biodynamo -- clone_shallow passes it to
  # `git clone -b`, so it cannot be a bare sha. Like the llvm-release rc row
  # above it pins a tag rather than a branch, so cutting the next serial moves
  # the key and republishes; see recipes/biodynamo/recipe.yaml for the naming
  # rules, which BioDynaMo's own version generator constrains.
  - { recipe: biodynamo,  version: 'v1.05-cr-20260812-01', os: ubuntu-24.04,     arch: x86_64 }
