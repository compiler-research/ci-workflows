name: 'Setup recipe'
description: |
  Probes a recipe cache for a prebuilt artifact (LLVM-asan,
  LLVM-wasm, cling, ...) keyed by the recipe inputs and downloads
  it. On miss, builds the recipe inline from source.

  The cache backend is configurable via cache-base — defaults to the
  compiler-research/ci-workflows Releases cache, but can point at a
  local directory (file:///path) or a private webserver
  (https://lab.local/...) for testing or air-gapped use.

inputs:
  recipe:
    required: true
    description: 'Recipe name; matches a directory under recipes/'
  version:
    required: true
    description: 'Version input, e.g. "22" — interpolated into the recipe source branch'
  os:
    required: true
    description: |
      OS slug for the cache key. Must match what publish-recipe used
      when writing the asset — typically a runner-image name like
      "ubuntu-24.04", "macos-26", "windows-2025". `runner.os` ("Linux"
      etc.) is a *different* namespace and will not hit the cache.
  arch:
    required: true
    description: |
      Architecture slug for the cache key (e.g. "x86_64", "arm64").
      Must match what publish-recipe used.
  build-on-miss:
    required: false
    default: 'false'
    description: |
      On cache miss, build the recipe inline. Default is 'false':
      consumers usually want a hard fail with a copy-pasteable
      publish-recipe invocation, not a silent ~30-min inline rebuild
      that doubles every PR run after a recipe-content change. Set
      to 'true' for the producer-of-record row that warms the cell.
  cache-base:
    required: false
    default: ''
    description: |
      Base URL for the cache backend. Supported schemes:
        file:///abs/path  — local directory (act/local testing)
        https://github.com/<owner>/<repo>/releases/download/<tag>/
        https://lab.local/recipes/  (read-only)
      When empty, RECIPE_CACHE_BASE env var wins; if that's also
      empty the baked-in default points at compiler-research/
      ci-workflows' Releases cache.
  ref:
    required: false
    default: 'main'
    description: |
      Ref of compiler-research/ci-workflows to read recipes/ from
      when computing the key. Pin to a sha while iterating; bump to
      a tag once the contract is stable.
  fetch-ccache:
    required: false
    default: 'false'
    description: |
      'true' also restores the sibling ccache snapshot published
      beside the install tree, and points ccache at it. For a
      consumer that has to build the recipe's own sources again in
      a configuration the install cannot express -- an in-tree
      build, another generator -- which is otherwise a cold
      half-hour. Requires ccache on PATH. No sibling is published
      for Windows cells, where this is a no-op with a notice.

outputs:
  path:
    description: 'Filesystem path to the recipe build tree'
    value: ${{ steps.finalize.outputs.path }}
  cache-hit:
    description: '"true" when downloaded from the cache, "false" when built inline'
    value: ${{ steps.finalize.outputs.cache-hit }}
  key:
    description: 'Computed cache key'
    value: ${{ steps.compute-key.outputs.key }}
  src-commit:
    description: |
      Source HEAD sha. Set by an inline build, and by fetch-ccache from
      the manifest of the artifact it restored -- which is the commit a
      consumer has to check out to reuse those objects.
    value: ${{ steps.ccache.outputs.src-commit || env.SRC_COMMIT }}
  ccache-dir:
    description: |
      Restored ccache directory, empty unless fetch-ccache was asked
      for and a sibling existed.
    value: ${{ steps.ccache.outputs.dir }}
  manifest:
    description: |
      Path to the restored artifact's manifest, empty unless
      fetch-ccache was asked for. Carries the cmake_args a consumer
      replays and the source commit it builds.
    value: ${{ steps.ccache.outputs.manifest }}

runs:
  using: composite
  steps:
    - name: Normalize OS/arch slugs
      id: slugs
      shell: bash
      env:
        IN_OS: ${{ inputs.os }}
        IN_ARCH: ${{ inputs.arch }}
      run: |
        os="$(echo "$IN_OS" | tr '[:upper:]' '[:lower:]')"
        arch="$(echo "$IN_ARCH" | tr '[:upper:]' '[:lower:]')"
        echo "os=$os" >> "$GITHUB_OUTPUT"
        echo "arch=$arch" >> "$GITHUB_OUTPUT"

    - name: Checkout ci-workflows recipes
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: |
        # Plain git clone instead of actions/checkout: the latter
        # declares `token` as required: true and fails under act
        # with no GITHUB_TOKEN available, even though the repo is
        # public. Sparse-checkout limits the working tree to the
        # two directories the rest of this action reads.
        #
        # `rm -rf` first so the step is idempotent: re-runs in the
        # same workspace (act with reused containers, or any job
        # that calls setup-recipe twice) would otherwise trip on
        # `git remote add origin` ("remote already exists") since
        # `git init` is the only idempotent half of the pair.
        rm -rf __ci_workflows__
        # Local-checkout override: bin/repro --ci-workflows stages the
        # dev's local ci-workflows tree (recipes + actions) into the
        # consumer repo and exports CI_WORKFLOWS_LOCAL. Copy from there
        # instead of fetching, so un-pushed recipe/action changes are
        # exercised end-to-end. A relative value is resolved against
        # GITHUB_WORKSPACE. Unset -> the normal git path below.
        if [[ -n "${CI_WORKFLOWS_LOCAL:-}" ]]; then
          src="${CI_WORKFLOWS_LOCAL}"
          [[ "$src" != /* ]] && src="${GITHUB_WORKSPACE}/${src}"
          mkdir -p __ci_workflows__
          cp -r "$src/recipes" "$src/actions" __ci_workflows__/
          echo "::notice title=setup-recipe::using local ci-workflows at $src (CI_WORKFLOWS_LOCAL)"
        else
          git init __ci_workflows__
          cd __ci_workflows__
          git remote add origin https://github.com/compiler-research/ci-workflows.git
          git sparse-checkout init --no-cone
          git sparse-checkout set recipes actions
          git fetch --depth=1 origin "$REF"
          git checkout FETCH_HEAD
        fi

    - name: Compute key
      id: compute-key
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        VERSION: ${{ inputs.version }}
        OS: ${{ steps.slugs.outputs.os }}
        ARCH: ${{ steps.slugs.outputs.arch }}
      run: |
        cd __ci_workflows__
        python3 actions/setup-recipe/compute_key.py \
          "$RECIPE" "$VERSION" "$OS" "$ARCH" >> "$GITHUB_OUTPUT"

    - name: Probe cache
      id: probe
      shell: bash
      env:
        KEY: ${{ steps.compute-key.outputs.key }}
        EXPLICIT_BASE: ${{ inputs.cache-base }}
      run: |
        set -euo pipefail
        cd __ci_workflows__
        base="$(python3 actions/lib/cache_io.py resolve-base "${EXPLICIT_BASE}")"
        echo "base=$base" >> "$GITHUB_OUTPUT"
        if python3 actions/lib/cache_io.py probe "$base" "$KEY"; then
          echo "hit=true" >> "$GITHUB_OUTPUT"
        else
          echo "hit=false" >> "$GITHUB_OUTPUT"
        fi

    # The recipe build's own ccache, published beside the install tree under
    # the same key. A consumer that has to compile the recipe's sources again
    # -- in a configuration an install tree cannot express -- reads it instead
    # of paying for the build a second time.
    #
    # publish-recipe hashed its entries with hash_dir off and base_dir at its
    # workspace root, so an entry is keyed on the path relative to that root.
    # What is left for the consumer is the source's own place in that root: it
    # has to sit where the recipe put it, or every lookup misses.
    - name: Restore the recipe's ccache
      id: ccache
      if: inputs.fetch-ccache == 'true' && steps.probe.outputs.hit == 'true'
      shell: bash
      env:
        KEY: ${{ steps.compute-key.outputs.key }}
        BASE: ${{ steps.probe.outputs.base }}
      run: |
        set -euo pipefail
        # Every path answers, so a consumer reading the output can tell
        # "restored" from "asked for and not there".
        nothing() {
          { echo "dir="; echo "src-commit="; } >> "$GITHUB_OUTPUT"
          exit 0
        }
        if [ "$RUNNER_OS" = Windows ]; then
          echo "::notice title=setup-recipe::no ccache sibling is published for Windows cells; nothing restored."
          nothing
        fi
        if ! command -v ccache >/dev/null 2>&1; then
          echo "::warning title=setup-recipe::fetch-ccache asked for but ccache is not on PATH; nothing restored."
          nothing
        fi
        cd __ci_workflows__
        if ! python3 actions/lib/cache_io.py probe "$BASE" "${KEY}.ccache"; then
          echo "::warning title=setup-recipe::no ccache sibling for ${KEY}; a rebuild starts cold."
          nothing
        fi
        rm -rf _ccache_dl
        mkdir -p _ccache_dl
        python3 actions/lib/cache_io.py download "$BASE" "${KEY}.ccache" _ccache_dl
        dir="${GITHUB_WORKSPACE}/.ccache"
        rm -rf "$dir"
        mv _ccache_dl/.ccache "$dir"
        rm -rf _ccache_dl
        # The producer's own settings, read from the manifest published beside
        # the asset. compiler_check is the version string of whatever compiler
        # the recipe was built with, which this runner cannot be asked for: get
        # it wrong and every lookup misses without saying so. base_dir is the
        # exception -- the producer's is its workspace, ours is ours.
        manifest="${GITHUB_WORKSPACE}/.recipe-manifest.json"
        url="${BASE%/}/${KEY}.manifest.json"
        case "$url" in
          file://*) cp "${url#file://}" "$manifest" ;;
          *)        curl -fsSL "$url" -o "$manifest" ;;
        esac
        mf() {
          python3 -c 'import json,sys,functools; print(functools.reduce(lambda a,k:(a or {}).get(k) or "", sys.argv[2].split("."), json.load(open(sys.argv[1]))) or "")' "$manifest" "$1"
        }
        cc_check="$(mf build_env.ccache.compiler_check)"
        hash_dir="$(mf build_env.ccache.hash_dir)"
        # The commit the objects were produced from. A consumer building those
        # sources again has to check out this one: ccache keys on preprocessed
        # output, so another commit of the same branch is another cache.
        src_commit="$(mf source.commit)"
        if [ "$src_commit" = unknown ]; then
          src_commit=""
        fi
        # Both: the env for anything downstream that reads it, and a step
        # output because that is what an action's `outputs:` can actually see.
        # A composite action's outputs are evaluated in its own context, where
        # env is what it was handed, not what its steps have since written.
        if [ -n "$src_commit" ]; then
          echo "SRC_COMMIT=$src_commit" >> "$GITHUB_ENV"
        fi
        echo "src-commit=$src_commit" >> "$GITHUB_OUTPUT"
        export CCACHE_DIR="$dir"
        ccache --set-config="base_dir=${GITHUB_WORKSPACE}"
        ccache --set-config="hash_dir=${hash_dir:-false}"
        if [ -n "$cc_check" ] && [ "$cc_check" != unknown ]; then
          ccache --set-config="compiler_check=$cc_check"
        else
          echo "::warning title=setup-recipe::the manifest records no compiler_check; lookups miss unless this runner's compiler matches the recipe's."
        fi
        if [ "${hash_dir:-false}" != false ]; then
          echo "::warning title=setup-recipe::the recipe hashed with hash_dir on, so its entries are bound to its own paths; expect misses."
        fi
        {
          echo "CCACHE_DIR=$dir"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
        } >> "$GITHUB_ENV"
        {
          echo "dir=$dir"
          echo "manifest=$manifest"
        } >> "$GITHUB_OUTPUT"
        echo "::notice title=setup-recipe::restored $(du -sh "$dir" | cut -f1) of the recipe build's ccache."

    - name: Ensure zstd (Windows)
      if: steps.probe.outputs.hit == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command zstd -ErrorAction SilentlyContinue)) {
          choco install -y zstandard
        }

    - name: Download + extract from cache
      if: steps.probe.outputs.hit == 'true'
      shell: bash
      env:
        KEY: ${{ steps.compute-key.outputs.key }}
        BASE: ${{ steps.probe.outputs.base }}
        RECIPE: ${{ inputs.recipe }}
        VERSION: ${{ inputs.version }}
        OS: ${{ steps.slugs.outputs.os }}
        ARCH: ${{ steps.slugs.outputs.arch }}
      run: |
        set -euo pipefail
        cd __ci_workflows__
        mkdir -p _llvm_dl
        python3 actions/lib/cache_io.py download "$BASE" "$KEY" _llvm_dl
        # Recipe's tarball root is `install/`; surface at $GITHUB_WORKSPACE.
        # `rm -rf ../install` first so the step is idempotent: a
        # re-run in the same workspace (act with reused containers, or
        # any flow that calls setup-recipe twice) would otherwise trip
        # `mv: cannot overwrite '../install': Directory not empty`
        # on the existing tree from the prior run. Mirrors the pattern
        # in the cache-miss "Build inline" branch below.
        if [[ -d _llvm_dl/install ]]; then
          rm -rf ../install
          mv _llvm_dl/install ../
        else
          # Defensive: some recipes may tar a different root in future.
          mv _llvm_dl/* ../ 2>/dev/null || true
        fi
        rm -rf _llvm_dl
        cd ..
        extracted=$(python3 -c "import os, sys; sz = sum(p.stat().st_size for p in __import__('pathlib').Path('install').rglob('*') if p.is_file()); print(f'{sz/1048576:.0f} MiB')" 2>/dev/null || echo '?')

        # Provenance notices: every operator looking at this run can
        # see at a glance what was loaded plus a clickable URL to the
        # full manifest (source commit, runner image, build timestamp).
        manifest_url="${BASE%/}/${KEY}.manifest.json"
        echo "::notice title=Recipe loaded from cache::${RECIPE} v${VERSION} (${OS}/${ARCH})"
        echo "::notice title=Recipe key::${KEY}"
        echo "::notice title=Recipe size on disk::${extracted}"
        echo "::notice title=Recipe manifest::${manifest_url}"

    - name: Build inline (cache miss)
      if: steps.probe.outputs.hit != 'true' && inputs.build-on-miss == 'true'
      shell: bash
      env:
        RECIPE_VERSION: ${{ inputs.version }}
        RECIPE_ARCH: ${{ steps.slugs.outputs.arch }}
        RECIPE_OS: ${{ steps.slugs.outputs.os }}
        WORK_DIR: ${{ github.workspace }}/_recipe_work
        OUT_DIR: ${{ github.workspace }}/_recipe_out
      run: |
        mkdir -p "$WORK_DIR" "$OUT_DIR"
        # Dispatch by recipe build script: prefer build.py (Python,
        # native on every OS) over build.sh (bash, requires git-bash
        # on Windows). Recipes migrate one at a time; both forms
        # produce $OUT_DIR/install as a relocatable install tree.
        recipe_dir=__ci_workflows__/recipes/${{ inputs.recipe }}
        if [[ -f "$recipe_dir/build.py" ]]; then
          python3 "$recipe_dir/build.py"
        else
          bash "$recipe_dir/build.sh"
        fi
        if [[ -d "$OUT_DIR/install" ]]; then
          rm -rf "$GITHUB_WORKSPACE/install"
          mv "$OUT_DIR/install" "$GITHUB_WORKSPACE/install"
        fi

    - name: Fail on miss when build-on-miss=false
      if: steps.probe.outputs.hit != 'true' && inputs.build-on-miss != 'true'
      shell: bash
      env:
        KEY: ${{ steps.compute-key.outputs.key }}
        RECIPE: ${{ inputs.recipe }}
        VERSION: ${{ inputs.version }}
        OS: ${{ steps.slugs.outputs.os }}
        ARCH: ${{ steps.slugs.outputs.arch }}
      run: |
        {
          echo "::error::no prebuilt for key=${KEY}"
          echo "::error::populate by running:"
          echo "::error::  gh workflow run publish-recipe.yml \\"
          echo "::error::    -R compiler-research/ci-workflows \\"
          echo "::error::    -f recipe=${RECIPE} -f version=${VERSION} \\"
          echo "::error::    -f os=${OS} -f arch=${ARCH}"
        } >&2
        exit 1

    - name: Finalize outputs
      id: finalize
      shell: bash
      env:
        HIT: ${{ steps.probe.outputs.hit }}
      run: |
        echo "path=${{ github.workspace }}/install" >> "$GITHUB_OUTPUT"
        echo "cache-hit=${HIT}" >> "$GITHUB_OUTPUT"
